name: astrbot_plugin_whale_radar
display_name: 小鲸鱼雷达
short_desc: 聊到她的日常爱好时，主动插话的概率会变高（关键词方向可在 QQ 里直接改）
desc: >-
  群聊被动监听：每条没唤醒她的群消息都会看一眼，「是不是在聊她感兴趣的东西」。
  兴趣词按「方向」分组（股票、游戏、吃饭……），每个方向有自己的权重，
  命中越多概率越高；没命中时可以再用一个便宜的模型打个 0-10 分，够分才插话。
  带冷却、每日上限、连续说话抑制，避免变成复读机。
  `/雷达` 系列指令可以在 QQ 里直接加词、改方向权重、改各种概率，改完立刻生效并落盘。
version: 0.5.0
author: qq-fish
repo: https://github.com/qq-fish/astrbot_plugin_whale_radar
astrbot_version: ">=4.17.0"
tags:
  - 群聊
  - 主动回复
  - 人格
help: |-
  /雷达                查看当前参数与本群状态
  /雷达 帮助           全部指令
  /雷达 词             看所有方向、权重、词
  /雷达 加词 股票 涨停 板了       往方向里加词（不存在就新建）
  /雷达 新方向 熬夜 70%           新建方向
  /雷达 方向 股票 85%             改方向权重
  /雷达 删词 涨停                 删词
  /雷达 设 基础 3%                改基础概率
  /雷达 测试 <一句话>              看这句话会怎么判、概率多少
  /雷达 学                        看自动学词状态
  /雷达 立刻学                     马上从最近聊天里学几个新爱好
  /雷达 学习记录                   看学到了什么、为什么
